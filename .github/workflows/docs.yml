name: Docs & benchmark report

# Builds the Sphinx docs and a multi-runner benchmark report, then publishes both to GitHub Pages:
#   https://<owner>.github.io/<repo>/                       documentation
#   https://<owner>.github.io/<repo>/benchmarks/report/     benchmark report (latest main)
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
  pull_request:
    paths: ["docs/**", "src/**", "csrc/**", ".github/workflows/docs.yml"]
  schedule:
    - cron: "17 4 * * 1"   # weekly, to track runner/dependency drift
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "chemprop>=2.2,<2.4" setuptools wheel ninja
      - name: Install chemprop-accel (native, so autodoc/status are real)
        env: {CHEMPROP_ACCEL_REQUIRE_NATIVE: "1"}
        run: pip install --no-build-isolation -e ".[docs]"
      - name: Build docs (warnings are errors)
        env: {GITHUB_REPOSITORY: "${{ github.repository }}"}
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-artifact@v4
        with: {name: docs-html, path: docs/_build/html}

  bench:
    name: bench · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}", cache: pip}
      - name: Install CPU PyTorch (Linux/Windows)
        if: runner.os != 'macOS'
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install PyTorch (macOS)
        if: runner.os == 'macOS'
        run: pip install torch
      - run: pip install "chemprop>=2.2,<2.4" setuptools wheel ninja
      - run: pip install --no-build-isolation --no-deps -e .
      - run: python -c "import chemprop_accel as c; print(c.status())"
      - name: Benchmark (speed + predictive equivalence)
        shell: bash
        run: |
          NAME="${{ matrix.os }}-py${{ matrix.python }}"
          python -m chemprop_accel.bench --preset ci --rounds 2 --name "$NAME" --output bench-out --max-minutes 30
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.os }}-py${{ matrix.python }}
          path: bench-out/results-*.json
          if-no-files-found: warn

  report:
    needs: bench
    if: always() && needs.bench.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/download-artifact@v4
        with: {pattern: "bench-*", path: results, merge-multiple: true}
      - name: Build combined HTML report (report.py is stdlib-only; no torch needed)
        run: |
          ls results
          python src/chemprop_accel/bench/report.py results/results-*.json -o report/index.html \
            --title "chemprop_accel benchmarks — ${GITHUB_SHA::7}"
          mkdir -p report/data && cp results/results-*.json report/data/
      - uses: actions/upload-artifact@v4
        with: {name: bench-report, path: report}
      - name: Fail if any accelerated run was not predictively equivalent
        run: |
          python - <<'PY'
          import glob, json, sys
          bad = [(p, e["mode"], e["key"]) for p in glob.glob("results/results-*.json")
                 for e in json.load(open(p)).get("equivalence", []) if not e["passed"]]
          for b in bad: print("EQUIVALENCE FAILURE:", b)
          sys.exit(1 if bad else 0)
          PY

  deploy:
    needs: [docs, report]
    if: github.event_name != 'pull_request' && needs.docs.result == 'success' && needs.report.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: docs-html, path: site}
      - uses: actions/download-artifact@v4
        with: {name: bench-report, path: site/benchmarks/report}
      - run: touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - id: deployment
        uses: actions/deploy-pages@v4
